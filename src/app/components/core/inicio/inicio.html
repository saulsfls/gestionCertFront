

<div class="container py-4">

  <header class="mb-4">
    <h1 class="h3 fw-bold mb-1">Inicio de sesion DEMO</h1>
    <p class="text-body-secondary mb-0">
      Salida y entrada de sesion, solo para desarrollo
    </p>
  </header>
  <section class="card mb-4">
    <div class="card-body d-flex flex-wrap gap-4">
      <button class="btn btn-success mb-4" (click)="login()">
        Iniciar sesión
      </button>

      <button class="btn btn-danger mb-4" (click)="logout()">
        Cerrar sesión
      </button>
    </div>


  </section>
</div>
