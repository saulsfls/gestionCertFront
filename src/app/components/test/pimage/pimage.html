<!-- ============================================================
     CARD 1: Cargar Tabla de Certificado (OCR)
     ============================================================ -->
<div class="container py-4">
  <div class="card p-3 shadow-sm mb-4">
    <h5 class="mb-3">Cargar Tabla de Certificado</h5>

    <!-- Área de Pegado -->
    <div
      class="paste-zone p-4 text-center border border-2 border-dashed rounded mb-3 bg-light"
      (paste)="onPaste($event)"
      tabindex="0"
    >
      <p class="mb-1 text-primary fw-bold">
        📋 Haz clic aquí y presiona <kbd>Ctrl + V</kbd> para pegar la imagen
      </p>
      <small class="text-muted">O selecciona un archivo local:</small>
      <input
        type="file"
        class="form-control form-control-sm mt-2"
        (change)="fileChangeEvent($event)"
        accept="image/*"
      />
    </div>

    <!-- Recortador de Imagen (Protegido contra SSR) -->
    @if (isBrowser) {
      <div
        class="cropper-wrapper mb-3"
        *ngIf="imageChangedEvent || pasteImageFile"
      >
        <p class="small text-muted mb-1 p-2">
          Ajusta los bordes para seleccionar únicamente la tabla:
        </p>
        <image-cropper
          [imageChangedEvent]="imageChangedEvent"
          [imageFile]="pasteImageFile"
          [maintainAspectRatio]="false"
          [resizeToWidth]="0"
          [cropperStaticWidth]="0"
          [cropperStaticHeight]="0"
          [canvasRotation]="0"
          format="png"
          (imageCropped)="imageCropped($event)"
          (imageLoaded)="imageLoaded($event)"
          (cropperReady)="cropperReady()"
          (loadImageFailed)="loadImageFailed()"
        ></image-cropper>
      </div>
    }

    <!-- Botón de Procesar -->
    <div class="d-flex justify-content-end mb-3">
      <button
        class="btn btn-primary"
        [disabled]="cargando"
        (click)="enviarANode()"
      >
        <span
          *ngIf="cargando"
          class="spinner-border spinner-border-sm me-1"
        ></span>
        {{ cargando ? 'Procesando...' : 'Extraer Tabla' }}
      </button>
    </div>

    <!-- Resultado: Tabla extraída -->
    <div
      *ngIf="mostrarTabla && tablaHeaders.length > 0"
      class="mt-3 p-3 border rounded bg-white"
    >
      <div
        class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2"
      >
        <h6 class="text-success fw-bold mb-0">✓ Datos Extraídos:</h6>
        <button
          type="button"
          class="btn btn-success btn-sm"
          [disabled]="tablaRows.length === 0"
          (click)="exportToExcel()"
        >
          <i class="bi bi-file-earmark-excel me-1"></i> Exportar a Excel
        </button>
      </div>

      <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover">
          <thead class="table-dark">
            <tr>
              <th *ngFor="let header of tablaHeaders">{{ header }}</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of tablaRows">
              <td *ngFor="let cell of row">{{ cell }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- (Opcional) Mostrar el texto crudo para depuración -->
      <details class="mt-3">
        <summary class="text-muted small">Ver texto original extraído</summary>
        <pre
          class="bg-light p-2 mt-2 rounded"
          style="white-space: pre-wrap; font-size: 0.8rem"
          >{{ tablaTexto }}</pre
        >
      </details>
    </div>
  </div>
</div>
