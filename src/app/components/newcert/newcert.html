
<div *ngIf="mensajeRespuesta" class="alert alert-info mt-3" role="alert">
    {{ mensajeRespuesta }}
</div>
<!-- Formulario Principal del Certificado -->
<div class="card mb-4 shadow-sm">
  <div class="card-header bg-dark text-white">
    <h5 class="m-0">Datos Generales del Certificado</h5>
  </div>
  <div class="card-body">
    <div class="row g-3">

      <!-- ID / Código del Equipo -->
      <div class="col-md-4">
        <label for="equipment_id" class="form-label fw-bold">ID del Equipo <span class="text-danger">*</span></label>
        <input
          type="text"
          id="equipment_id"
          class="form-control"
          [(ngModel)]="certificado.equipment_id"
          maxlength="30"
          (ngModelChange)="onTableChange()"
          placeholder="Ej: EQ-2026-001"
          required
        >
      </div>

      <!-- Nombre del Equipo -->
      <div class="col-md-5">
        <label for="name_equipment" class="form-label fw-bold">Nombre del Equipo <span class="text-danger">*</span></label>
        <input
          type="text"
          id="name_equipment"
          class="form-control"
          maxlength="30"
          [(ngModel)]="certificado.name_equipment"
          placeholder="Ej: Multímetro Digital / Calibrador"
          required
        >
      </div>

      <!-- Código / Folio del Certificado (CC) -->
      <div class="col-md-3">
        <label for="cc" class="form-label fw-bold">Folio / CC</label>
        <input
          type="text"
          id="cc"
          maxlength="50"
          class="form-control"
          [(ngModel)]="certificado.cc"
          placeholder="Ej: CC-89421"
        >
      </div>

      <!-- Fecha de Calibración -->
      <div class="col-md-3">
        <label for="date_cal" class="form-label fw-bold">Fecha de Calibración</label>
        <input
          type="date"
          id="date_cal"
          class="form-control"
          [(ngModel)]="certificado.date_cal"
        >
      </div>

      <!-- Fecha de Emisión/Certificado (date_cc) -->
      <div class="col-md-3">
        <label for="date_cc" class="form-label fw-bold">Fecha del Certificado</label>
        <input
          type="date"
          id="date_cc"
          class="form-control"
          [(ngModel)]="certificado.date_cc"
        >
      </div>

      <!-- Entidad emisora -->
      <div class="col-md-3">
        <label for="entity" class="form-label fw-bold">Entidad emisora</label>
        <input
          type="text"
          id="entity"
          class="form-control"
          maxlength="30"
          [(ngModel)]="certificado.entity"
          placeholder="LECOE"
        >
      </div>

      <!-- Comentarios -->
      <div class="col-md-3">
        <label for="comments" class="form-label fw-bold">Comentarios</label>
        <input
          type="text"
          id="comments"
          class="form-control"
          maxlength="100"
          [(ngModel)]="certificado.comments"
          placeholder="Comments"
        >
      </div>

      <div class="col-md-3">
        <label for="cert_type" class="form-label fw-bold">Tipo de certificado</label>
        <select
          id="cert_type"
          class="form-select"
          [(ngModel)]="certificado.cert_type"
        >
          <option value="" disabled selected>Seleccione una opción</option>
          <option value="Certificado">Certificado</option>
          <option value="Especificaciones del fabricante">Especificaciones del fabricante</option>
        </select>
      </div>

      <!-- Estatus Activo / Inactivo -->
      <div class="col-12 mt-3">
        <div class="form-check form-switch">
          <input
            class="form-check-input"
            type="checkbox"
            role="switch"
            id="active"
            [(ngModel)]="certificado.active"
          >
          <label class="form-check-label fw-bold" for="active">
            Certificado Activo {{ certificado.active ? '(Habilitado)' : '(Inactivo)' }}
          </label>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold m-0">Resultados del Certificado</h3>

    <div class="d-flex align-items-center gap-3">
      <div class="d-flex align-items-center bg-light border rounded px-2 py-1">
        <label class="form-label fw-semibold small text-secondary m-0 me-2">Navegación con Tab:</label>
        <div class="btn-group btn-group-sm" role="group">
          <input
            type="radio"
            class="btn-check"
            name="direccionTab"
            id="tabVertical"
            value="vertical"
            [(ngModel)]="direccionTab">
          <label class="btn btn-outline-primary" for="tabVertical">Vertical ↓</label>

          <input
            type="radio"
            class="btn-check"
            name="direccionTab"
            id="tabHorizontal"
            value="horizontal"
            [(ngModel)]="direccionTab">
          <label class="btn btn-outline-primary" for="tabHorizontal">Horizontal →</label>
        </div>
      </div>

      <button class="btn btn-success" type="button" (click)="agregarTabla()">
        + Agregar Nueva Tabla
      </button>
    </div>
  </div>

  <!-- Bucle de Tablas -->
  <ng-container *ngFor="let tabla of tablasResultados; let i = index">
    <div class="card mb-4 border-primary shadow-sm">

      <!-- Encabezado colapsable -->
      <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <button
          class="btn btn-link text-white text-decoration-none p-0 fw-bold d-flex align-items-center gap-2 shadow-none"
          type="button"
          data-bs-toggle="collapse"
          [attr.data-bs-target]="'#collapseTabla' + i"
          aria-expanded="true"
          [attr.aria-controls]="'collapseTabla' + i">
          <span>▼</span>
          <span class="fs-5">Tabla #{{ i + 1 }} {{ tabla.titulo }}</span>
        </button>

        <button
          *ngIf="tablasResultados.length > 1"
          class="btn btn-danger btn-sm"
          type="button"
          (click)="eliminarTabla(i)">
          Eliminar Tabla
        </button>
      </div>

      <!-- Cuerpo colapsable de la Card -->
      <div [id]="'collapseTabla' + i" class="collapse show">
        <div class="card-body">

          <!-- Propiedades de la Tabla -->
          <div class="row g-3 p-3 mb-4 bg-light rounded border">
            <h6 class="text-secondary fw-bold mb-0">Propiedades del ensayo</h6>

            <div class="col-md-6">
              <label class="form-label fw-semibold small">Título:</label>
              <div class="d-flex gap-2 align-items-center">
                <select
                  class="form-select"
                  [ngModel]="tabla.titulo"
                  (ngModelChange)="tabla.titulo = $event; onTableChange(); actualizarMesurandoSegunTitulo(tabla)"
                  style="flex:1;"
                >
                  <option *ngFor="let opcion of opcionesTitulo" [value]="opcion">
                    {{ opcion }}
                  </option>
                </select>

                <!-- Input para "Otro" (visible solo si el título no es predefinido) -->
                <input
                  *ngIf="!esTituloPredefinido(tabla.titulo)"
                  type="text"
                  class="form-control"
                  [(ngModel)]="tabla.titulo"
                  (ngModelChange)="onTableChange()"
                  placeholder="Escriba título personalizado"
                  style="flex:2;"
                />
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold small">Mesurando:</label>
              <!-- Si el título es predefinido, mostrar select con opciones -->
              <ng-container *ngIf="esTituloPredefinido(tabla.titulo); else otroMesurando">
                <select
                  class="form-select"
                  [(ngModel)]="tabla.mesurando"
                  (ngModelChange)="onTableChange()"
                >
                  <option *ngFor="let opcion of obtenerOpcionesMesurando(tabla.titulo)" [value]="opcion">
                    {{ opcion }}
                  </option>
                </select>
              </ng-container>
              <!-- Si es "Otro", mostrar input de texto libre -->
              <ng-template #otroMesurando>
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="tabla.mesurando"
                  (ngModelChange)="onTableChange()"
                  placeholder="Especifique el mesurando"
                />
              </ng-template>
            </div>

            <div class="col-md-3">
              <label class="form-label fw-semibold small">Unidad:</label>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="tabla.unit"
                (ngModelChange)="onTableChange()"
                placeholder="Ej: kV">
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold small">Ecuación de calibración</label>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="tabla.ecuation_calibration"
                (ngModelChange)="onTableChange()"
                placeholder="Ej: V=I*R">
            </div>

            <div class="col-md-4">
              <label class="form-label fw-semibold small">Rango:</label>
              <input
                type="text"
                class="form-control"
                [(ngModel)]="tabla.range"
                (ngModelChange)="onTableChange()"
                placeholder="Ej: 0v - 100v">
            </div>

          </div>

          <!-- Estructura de Tabla -->
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="fw-bold m-0">Estructura y Resultados</h6>
            <button class="btn btn-outline-primary btn-sm" type="button" (click)="agregarColumna(tabla)">
              + Agregar Columna
            </button>
          </div>

          <div class="table-responsive">
            <table class="table table-bordered align-middle mb-2">
              <thead class="table-secondary">
                <tr>
                  <th *ngFor="let col of tabla.columnas; let j = index" class="p-2" style="min-width: 170px;">
                    <div class="d-flex flex-column gap-1">
                      <div class="d-flex justify-content-between align-items-center">
                        <span class="badge bg-dark">Col {{ j + 1 }}</span>
                        <button
                          *ngIf="tabla.columnas.length > 1"
                          class="btn btn-outline-danger btn-sm p-0 px-1 border-0"
                          type="button"
                          (click)="eliminarColumna(tabla, j)">
                          &times;
                        </button>
                      </div>

                      <input
                        type="text"
                        class="form-control form-control-sm"
                        [ngModel]="col.key"
                        (ngModelChange)="actualizarKeyColumna(col, $event, tabla)"
                        placeholder="key">

                      <input
                        type="text"
                        class="form-control form-control-sm"
                        [(ngModel)]="col.label"
                        (ngModelChange)="onTableChange()"
                        placeholder="label">

                      <input
                        type="text"
                        class="form-control form-control-sm"
                        [(ngModel)]="col.unit"
                        (ngModelChange)="onTableChange()"
                        placeholder="unit">

                      <select
                        class="form-select form-select-sm fw-bold text-primary"
                        [(ngModel)]="col.type"
                        (change)="cambiarTipoDato(col, tabla)">
                        <option value="number">Number</option>
                        <option value="string">String</option>
                      </select>
                    </div>
                  </th>
                  <th style="width: 50px;" class="text-center align-middle"></th>
                </tr>
              </thead>

              <tbody>
                <tr *ngFor="let fila of tabla.filas; let filaIndex = index">
                  <td *ngFor="let col of tabla.columnas; let colIndex = index">
                    <input
                      [id]="'input-' + i + '-' + filaIndex + '-' + colIndex"
                      [type]="col.type === 'number' ? 'number' : 'text'"
                      class="form-control form-control-sm"
                      [(ngModel)]="fila[col.key]"
                      (ngModelChange)="onTableChange()"
                      (keydown.tab)="onTabKeydown($event, i, filaIndex, colIndex)"
                      placeholder="null">
                  </td>

                  <td class="text-center align-middle">
                    <button
                      *ngIf="tabla.filas.length > 1"
                      class="btn btn-outline-danger btn-sm"
                      type="button"
                      (click)="eliminarFila(tabla, filaIndex)"
                      title="Eliminar fila">
                      &times;
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <button class="btn btn-secondary btn-sm" type="button" (click)="agregarFila(tabla)">
            + Agregar Fila
          </button>

          <!-- NUEVO: Comentarios de la tabla -->
          <div class="mt-3">
            <label for="tableComments{{i}}" class="form-label fw-semibold small">Comentarios de la tabla:</label>
            <textarea
              id="tableComments{{i}}"
              class="form-control"
              rows="3"
              [(ngModel)]="tabla.coments"
              (ngModelChange)="onTableChange()"
              placeholder="Sin comentarios"
            ></textarea>
          </div>

        </div>
      </div>

    </div>
  </ng-container>

  <!-- Previsualizador y Editor de JSON (sin botón de actualizar) -->
  <div class="card bg-dark text-white shadow-sm mb-4">
    <div class="card-header d-flex justify-content-between align-items-center border-secondary p-2">
      <button
        class="btn btn-link text-white text-decoration-none fw-bold p-0 d-flex align-items-center gap-2"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#collapseJsonArea"
        aria-expanded="false"
        aria-controls="collapseJsonArea">
        <i class="bi bi-chevron-down"></i>
        <span class="font-monospace">JSON del Certificado</span>
        <span class="badge bg-secondary">{{ jsonInputText.length }} caracteres</span>
        <span class="badge bg-secondary">{{ jsonInputText.split('\n').length }} líneas</span>
        <span class="badge bg-primary">Editable</span>
      </button>

      <div class="d-flex gap-2">
        <!-- Botón de copiar -->
        <button class="btn btn-outline-light btn-sm" type="button" (click)="copiarJson()">
          {{ copiadoExitoso ? 'Copiado' : 'Copiar JSON' }}
        </button>
      </div>
    </div>

    <div class="collapse" id="collapseJsonArea">
      <div class="card-body p-3 border-top border-secondary">
        <textarea
          id="jsonAreaInput"
          class="form-control bg-dark text-success font-monospace border-secondary"
          rows="12"
          [(ngModel)]="jsonInputText"
          placeholder="El JSON se actualiza automáticamente al modificar la tabla..."
          style="resize: vertical; font-size: 0.9rem;"
        ></textarea>
      </div>
    </div>
  </div>

  <!-- Alerta de Bootstrap para Mensajes -->
  <div
    *ngIf="mensajeRespuesta"
    class="alert alert-dismissible fade show mt-3 shadow-sm"
    [ngClass]="esError ? 'alert-danger' : 'alert-success'"
    role="alert">
    <strong>{{ esError ? '¡Atención!' : '¡Éxito!' }}</strong> {{ mensajeRespuesta }}
    <button type="button" class="btn-close" (click)="mensajeRespuesta = null" aria-label="Close"></button>
  </div>

  <!-- Botón de Guardado Directo -->
  <div class="d-flex justify-content-end my-4">
    <button
      type="button"
      class="btn btn-success btn-lg shadow-sm"
      (click)="guardarCertificado()">
      Guardar Certificado
    </button>
  </div>

</div>
